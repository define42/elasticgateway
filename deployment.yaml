apiVersion: v1
kind: Namespace
metadata:
  name: elasticgateway
---
apiVersion: v1
kind: Secret
metadata:
  name: elasticgateway-secrets
  namespace: elasticgateway
type: Opaque
stringData:
  ELASTIC_PASSWORD: "Cedar7!FluxOrbit29"
  SESSION_SECRET: "local-dev-session-secret-change-me-32"
---
