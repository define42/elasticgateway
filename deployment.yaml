      listen = "0.0.0.0:389"

    [backend]
      datastore = "config"
      baseDN = "dc=glauth,dc=com"
      nameformat = "cn"
      groupformat = "ou"

    [behaviors]
      IgnoreCapabilities = true

    [[users]]
      name = "johndoe"
      primarygroup = 5510
      othergroups = [5510, 5560]
      mail = "johndoe@example.com"
      passsha256 = "6478579e37aff45f013e14eeb30b3cc56c72ccdc310123bcdf53e0333e3f416a"
      [[users.capabilities]]
